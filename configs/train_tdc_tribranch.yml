name: Seed42_DirectEventToRGB2CA_EncoderRestormerChannelSA_2D_Plain_Server_5GPU_FromScratch_600ep

model:
  type: progressive_fusion
  base_dim: 32

  # Fusion modes with selectable cross-attention:
  # swapped_kv_cascaded_ca = sequential swapped-K/V fusion.
  # parallel_swapped_kv_cat_ca = two independent swapped-KV CAs read the same RGB,
  #                              then concatenate and project their residual deltas.
  # bidirectional_event_then_rgb_ca = cross-enhance E2/E3, then both guide RGB.
  # independent_event_then_rgb_4ca = parameter-matched four-CA control where E2/E3
  #                                  are enhanced independently before guiding RGB.
  # direct_event_to_rgb_2ca = remove the two event-event CAs; raw E2/E3 directly
  #                           guide RGB through the unchanged final two-CA path.
  # Specialized modes (require cross_attn_type=channel):
  # event_reorg_b23_ca = E2 reference reorganizes E3 V; RGB reads via the SAME E2 reference.
  # soft_routed_dual_ca = dynamic complementary routing of concatenated E2/E3 channels,
  #                       then parallel Channel CA + Window CA with same-source K/V.
  fusion_mode: direct_event_to_rgb_2ca
  # Retained fusion modes use mean(Event3D) in 2D fusion space.
  fusion_dim: 2d
  # Used by Swapped-KV, Parallel Swapped-KV, four-CA modes and direct two-CA ablation.
  # shifted_window is one half-window-shifted CA block, not a fixed+shifted pair.
  cross_attn_type: channel        # channel / window / shifted_window

  # Used only by swapped_kv_cascaded_ca (parallel mode always computes both orders):
  # event3d_first = CA1(RGB,E3K,E2V), then CA2(RGB1,E2K,E3V)
  # event2d_first = CA1(RGB,E2K,E3V), then CA2(RGB1,E3K,E2V)
  swapped_kv_order: event3d_first

  # Encoder branch self-attention:
  # window                    = previous fixed non-overlapping WindowSA.
  # plain_channel             = plain global channel SA.
  # restormer_channel         = Restormer-style global channel SA.
  # restormer_window          = one fixed-window Restormer-style block.
  # restormer_shifted_window  = fixed-window block followed by half-window shifted block.
  encoder_self_attn: restormer_channel
  # Used by all window-based encoder self-attention modes.
  self_attn_window_size: 8
  cross_attn_window_size: 8
  # Used by Event3D self-attention and all 3D fusion modes.
  temporal_window_size: 2
  num_heads: 4
  # Used by the existing self/window attention modes. New ablation modes fix their own Q/K rule.
  qk_norm: false
  gamma_init: 0.1

  # RGB-only deformable local alignment; keep off in the encoder-SA experiment.
  deform_alignment: none          # none / image_guided
  # Decoder ablation: plain keeps the previous decoder; residual adds a local shortcut in each UpBlock.
  decoder_block: plain            # plain / residual
  # Optional Restormer-style channel SA after each upsample/skip/conv block.
  decoder_attention: none         # none / restormer_channel
  # Stage-2 ablation. Keep sam_mode=none when two_stage=false.
  two_stage: false                # false / true
  sam_mode: none                  # none / standard / event_guided
  refine_type: shallow            # shallow / light_unet

loss:
  type: l1
  edge_weight: 0.05

datasets:
  train:
    # 2060 profile:
    # dataset_type: h5
    # dataroot: F:/datasets/GOPRO/train
    # batch_size: 1
    # num_workers: 2
    # prefetch_factor: 2
    # max_open_h5: 2

    # Server profile:
    dataset_type: server_voxel
    blur_root: /data1/YW/DVS_DATA/voxel_grid/train/blur
    gt_root: /data1/YW/DVS_DATA/voxel_grid/train/gt
    event_root: /data1/YW/DVS_DATA/voxel_grid/train/event_0.1_0.1
    event_ext: .npy
    batch_size: 1
    num_workers: 4
    prefetch_factor: 2
    event_bins: 6
    patch_size: 256
    norm_event: true
  val:
    # 2060 profile:
    # dataset_type: h5
    # dataroot: F:/datasets/GOPRO/test
    # max_open_h5: 2

    # Server profile:
    dataset_type: server_voxel
    blur_root: /data1/YW/DVS_DATA/voxel_grid/test/blur
    gt_root: /data1/YW/DVS_DATA/voxel_grid/test/gt
    event_root: /data1/YW/DVS_DATA/voxel_grid/test/event_0.1_0.1
    event_ext: .npy
    event_bins: 6
    patch_size: 256
    norm_event: true
    num_workers: 0

train:
  num_epochs: 600
  learning_rate: 0.0002
  # 1 preserves the previous behavior: validate after every epoch.
  val_interval: 1
  # Use the same seed and deterministic mode for fair ablations.
  seed: 42
  deterministic: true
  # Used only when two_stage=true: L = w2*L(final,GT) + w1*L(stage1,GT).
  stage1_loss_weight: 0.5
  stage2_loss_weight: 1.0

path:
  # 2060: ./experiments
  # Server: /data1/jzy/experiments
  experiments_root: /data1/jzy/experiments
  # Load model weights only and start a new experiment from epoch 0.
  pretrain_model: ~
  # Resume model, optimizer, epoch, and RNG state in the original experiment.
  resume_state: ~
