name: ThreeBranch_Cat_2D_Server_60ep

model:
  type: progressive_fusion
  base_dim: 32

  # cat / single_ca / cascaded_ca
  fusion_mode: cat
  # 2d: mean Event3D before fusion; 3d: preserve time until fusion finishes.
  fusion_dim: 2d

  # Used by single_ca:
  # event2d_k_event3d_v = Q:RGB, K:Event2D, V:Event3D
  # event3d_k_event2d_v = Q:RGB, K:Event3D, V:Event2D
  single_ca_order: event2d_k_event3d_v

  # Used by cascaded_ca:
  # motion_then_struct = RGB attends Event3D, then Event2D
  # struct_then_motion = RGB attends Event2D, then Event3D
  # event_then_rgb     = Event3D attends Event2D, then RGB attends fused event
  cascaded_ca_order: motion_then_struct

  # Separate spatial windows for branch self-attention and feature fusion.
  self_attn_window_size: 8
  cross_attn_window_size: 8
  # Used by Event3D self-attention and all 3D fusion modes.
  temporal_window_size: 2
  num_heads: 4
  qk_norm: false
  gamma_init: 0.1

loss:
  type: l1
  edge_weight: 0.05

datasets:
  train:
    # 2060 profile:
    # dataset_type: h5
    # dataroot: F:/datasets/GOPRO/train
    # batch_size: 1
    # num_workers: 2
    # prefetch_factor: 2
    # max_open_h5: 2

    # Server profile:
    dataset_type: server_voxel
    blur_root: /data1/YW/DVS_DATA/voxel_grid/train/blur
    gt_root: /data1/YW/DVS_DATA/voxel_grid/train/gt
    event_root: /data1/YW/DVS_DATA/voxel_grid/train/event_0.1_0.1
    event_ext: .npy
    batch_size: 1
    num_workers: 4
    prefetch_factor: 2
    event_bins: 6
    patch_size: 256
    norm_event: true
  val:
    # 2060 profile:
    # dataset_type: h5
    # dataroot: F:/datasets/GOPRO/test
    # max_open_h5: 2

    # Server profile:
    dataset_type: server_voxel
    blur_root: /data1/YW/DVS_DATA/voxel_grid/test/blur
    gt_root: /data1/YW/DVS_DATA/voxel_grid/test/gt
    event_root: /data1/YW/DVS_DATA/voxel_grid/test/event_0.1_0.1
    event_ext: .npy
    event_bins: 6
    patch_size: 256
    norm_event: true
    num_workers: 0

train:
  num_epochs: 60
  learning_rate: 0.0002

path:
  # 2060: ./experiments
  # Server: /data1/jzy/experiments
  experiments_root: /data1/jzy/experiments
  resume_state: ~
