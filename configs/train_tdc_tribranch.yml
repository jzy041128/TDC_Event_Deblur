name: Seed42_SwappedKV_EncoderRestormerSA_2D_Plain_Server_600ep

model:
  type: progressive_fusion
  base_dim: 32

  # Main modes: cat / single_ca / cascaded_ca / swapped_kv_cascaded_ca
  # Event aggregation ablations:
  # event_conv          = EventConv only, without cross-attention.
  # event_window_ca     = EventConv + normalized WindowCA + learnable temperature.
  # plain_channel_ca    = EventConv + standard scaled channel cross-attention.
  # channel_ca          = EventConv + normalized channel CA + learnable temperature.
  # event_add_channel_ca = Event2D + mean(Event3D), then normalized channel CA.
  fusion_mode: swapped_kv_cascaded_ca
  # 2d: mean Event3D before fusion; 3d: preserve time until fusion finishes.
  fusion_dim: 2d
  # Used by single_ca/cascaded_ca/swapped_kv_cascaded_ca.
  cross_attn_type: channel        # window / channel

  # Used by single_ca:
  # event2d_k_event3d_v = Q:RGB, K:Event2D, V:Event3D
  # event3d_k_event2d_v = Q:RGB, K:Event3D, V:Event2D
  single_ca_order: event2d_k_event3d_v

  # Used by cascaded_ca:
  # motion_then_struct = RGB attends Event3D, then Event2D
  # struct_then_motion = RGB attends Event2D, then Event3D
  # event_then_rgb     = Event3D attends Event2D, then RGB attends fused event
  cascaded_ca_order: motion_then_struct

  # Used by swapped_kv_cascaded_ca:
  # event3d_first = CA1(RGB,E3K,E2V), then CA2(RGB1,E2K,E3V)
  # event2d_first = CA1(RGB,E2K,E3V), then CA2(RGB1,E3K,E2V)
  swapped_kv_order: event3d_first

  # Encoder branch self-attention: previous WindowSA / Restormer-style channel SA.
  encoder_self_attn: restormer_channel  # window / restormer_channel
  # Used only when encoder_self_attn=window.
  self_attn_window_size: 8
  cross_attn_window_size: 8
  # Used by Event3D self-attention and all 3D fusion modes.
  temporal_window_size: 2
  num_heads: 4
  # Used by the existing self/window attention modes. New ablation modes fix their own Q/K rule.
  qk_norm: false
  gamma_init: 0.1

  # RGB-only deformable local alignment; keep off in the encoder-SA experiment.
  deform_alignment: none          # none / image_guided
  # Decoder ablation: plain keeps the previous decoder; residual adds a local shortcut in each UpBlock.
  decoder_block: plain            # plain / residual
  # Optional Restormer-style channel SA after each upsample/skip/conv block.
  decoder_attention: none         # none / restormer_channel
  # Stage-2 ablation. Keep sam_mode=none when two_stage=false.
  two_stage: false                # false / true
  sam_mode: none                  # none / standard / event_guided
  refine_type: shallow            # shallow / light_unet

loss:
  type: l1
  edge_weight: 0.05

datasets:
  train:
    # 2060 profile:
    # dataset_type: h5
    # dataroot: F:/datasets/GOPRO/train
    # batch_size: 1
    # num_workers: 2
    # prefetch_factor: 2
    # max_open_h5: 2

    # Server profile:
    dataset_type: server_voxel
    blur_root: /data1/YW/DVS_DATA/voxel_grid/train/blur
    gt_root: /data1/YW/DVS_DATA/voxel_grid/train/gt
    event_root: /data1/YW/DVS_DATA/voxel_grid/train/event_0.1_0.1
    event_ext: .npy
    batch_size: 1
    num_workers: 4
    prefetch_factor: 2
    event_bins: 6
    patch_size: 256
    norm_event: true
  val:
    # 2060 profile:
    # dataset_type: h5
    # dataroot: F:/datasets/GOPRO/test
    # max_open_h5: 2

    # Server profile:
    dataset_type: server_voxel
    blur_root: /data1/YW/DVS_DATA/voxel_grid/test/blur
    gt_root: /data1/YW/DVS_DATA/voxel_grid/test/gt
    event_root: /data1/YW/DVS_DATA/voxel_grid/test/event_0.1_0.1
    event_ext: .npy
    event_bins: 6
    patch_size: 256
    norm_event: true
    num_workers: 0

train:
  num_epochs: 600
  learning_rate: 0.0002
  # Use the same seed and deterministic mode for fair ablations.
  seed: 42
  deterministic: true
  # Used only when two_stage=true: L = w2*L(final,GT) + w1*L(stage1,GT).
  stage1_loss_weight: 0.5
  stage2_loss_weight: 1.0

path:
  # 2060: ./experiments
  # Server: /data1/jzy/experiments
  experiments_root: /data1/jzy/experiments
  resume_state: ~
