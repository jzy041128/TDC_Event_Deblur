name: ProgressiveFusion_TDC_SE3D_QKV3D_2060_30ep

model:
  # 1) structure type:
  # progressive_fusion = fusion feedbacks into the next RGB stage, closer to the MAFNet-style idea.
  # parallel_fusion    = each scale is encoded first and fused later, closer to the original TDC-style idea.
  type: progressive_fusion
  base_dim: 32

  # 2) gate base: tdc / e3d
  gated_3devent_base: tdc
  # 3) gate type:
  # se3d     = channel-only 3D gate
  # spatial3d = spatial-temporal-only 3D gate
  # cbam3d   = se3d + spatial3d
  gated_3devent_gate: se3d

  # 4) fusion dimension: 3d / 2d
  stage_fusion_dim: 3d
  # 5) fusion mode: cat / qkv_2d_k_3d_v / qkv_3d_k_2d_v / qkv_merged / qkv_3d_only / qkv_2d_only
  stage_fusion_mode: qkv_2d_k_3d_v

  gamma_init: 0.0
  event_inject_gamma_init: 0.1
  window_size: 8
  temporal_window: 2
  num_heads: 4
  qk_norm: false
  use_rgb_self_attn_all_scales: true
  use_event2d_self_attn_all_scales: true
  use_event3d_self_attn_all_scales: true

  # Used only when type is changed to parallel_fusion:
  # late_fusion_mode: gated_3devent
  # event_encoder_type: 2d
  # attention_dim: 2d

  # Legacy options for older non-gated baselines:
  # fusion_type: hybrid
  # qkv_mode: rgb_qk_event_v
  # late_fusion_mode: kv_2d_k_tdc_v_plus
  # event_encoder_type: 2d
  # attention_dim: 2d

loss:
  type: l1
  edge_weight: 0.05

datasets:
  train:
    # 2060 profile:
    dataset_type: h5
    dataroot: E:/GOPRO/GOPRO/train
    batch_size: 1
    num_workers: 2
    prefetch_factor: 2
    max_open_h5: 2

    # Server profile:
    # dataset_type: server_voxel
    # blur_root: /data1/YW/DVS_DATA/voxel_grid/train/blur
    # gt_root: /data1/YW/DVS_DATA/voxel_grid/train/gt
    # event_root: /data1/YW/DVS_DATA/voxel_grid/train/event_0.1_0.1
    # event_ext: .npy
    # batch_size: 1
    # num_workers: 4
    # prefetch_factor: 2
    event_bins: 6
    patch_size: 256
    norm_event: true
  val:
    # 2060 profile:
    dataset_type: h5
    dataroot: E:/GOPRO/GOPRO/test
    max_open_h5: 2

    # Server profile:
    # dataset_type: server_voxel
    # blur_root: /data1/YW/DVS_DATA/voxel_grid/test/blur
    # gt_root: /data1/YW/DVS_DATA/voxel_grid/test/gt
    # event_root: /data1/YW/DVS_DATA/voxel_grid/test/event_0.1_0.1
    # event_ext: .npy
    event_bins: 6
    patch_size: 256
    norm_event: true

train:
  num_epochs: 30
  learning_rate: 0.0002
  # Server 7-GPU is selected by command, not YAML:
  # torchrun --nproc_per_node=7 train_ddp.py --config configs/train_tdc_tribranch.yml

path:
  # 2060: ./experiments
  # Server: /data1/jzy/experiments
  experiments_root: ./experiments
  resume_state: ~
