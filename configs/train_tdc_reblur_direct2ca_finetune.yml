name: Seed42_DirectEventToRGB2CA_EncoderRestormerChannelSA_REBlur_Finetune_5GPU_200ep

model:
  type: progressive_fusion
  base_dim: 32
  fusion_mode: direct_event_to_rgb_2ca
  fusion_dim: 2d
  cross_attn_type: channel
  swapped_kv_order: event3d_first
  encoder_self_attn: restormer_channel
  self_attn_window_size: 8
  cross_attn_window_size: 8
  temporal_window_size: 2
  num_heads: 4
  qk_norm: false
  gamma_init: 0.1
  deform_alignment: none
  decoder_block: plain
  decoder_attention: none
  two_stage: false
  sam_mode: none
  refine_type: shallow

loss:
  type: l1
  edge_weight: 0.05

datasets:
  train:
    dataset_type: h5
    dataroot: /data1/jzy/datasets/REBlur/train
    batch_size: 1
    num_workers: 4
    prefetch_factor: 2
    max_open_h5: 2
    patch_size: 256
    norm_event: true
  val:
    dataset_type: h5
    dataroot: /data1/jzy/datasets/REBlur/test
    max_open_h5: 2
    # Null keeps the complete 260x320 REBlur image.
    patch_size: ~
    norm_event: true
    num_workers: 0

train:
  num_epochs: 200
  learning_rate: 0.00002
  # Validate every five epochs; the final epoch is always validated.
  val_interval: 5
  seed: 42
  deterministic: true
  stage1_loss_weight: 0.5
  stage2_loss_weight: 1.0

path:
  experiments_root: /data1/jzy/experiments
  # Fine-tune from the architecture-matched GoPro Direct 2CA checkpoint.
  pretrain_model: /data1/jzy/experiments/Seed42_DirectEventToRGB2CA_EncoderRestormerChannelSA_2D_Plain_Server_5GPU_FromScratch_600ep_20260914_130935/best.pth
  # Keep null for fine-tuning; use this only to resume the new REBlur run later.
  resume_state: ~
