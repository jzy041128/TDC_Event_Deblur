name: BidirectionalEventThenRGB4CA_EVRB_FullResolution_Eval

model:
  type: progressive_fusion
  rgb_in: 3
  event_in: 16
  base_dim: 32
  fusion_mode: bidirectional_event_then_rgb_ca
  fusion_dim: 2d
  cross_attn_type: channel
  swapped_kv_order: event3d_first
  encoder_self_attn: restormer_channel
  self_attn_window_size: 8
  cross_attn_window_size: 8
  temporal_window_size: 2
  num_heads: 4
  qk_norm: false
  gamma_init: 0.1
  deform_alignment: none
  decoder_block: plain
  decoder_attention: none
  two_stage: false
  sam_mode: none
  refine_type: shallow

datasets:
  val:
    dataset_type: evrb
    dataroot: /data1/jzy/datasets/EVRB/test
    event_bins: 16
    patch_size: 256
    norm_event: true
    num_workers: 0

train:
  seed: 42
  deterministic: true
