name: Seed42_BidirectionalEventThenRGB4CA_EncoderRestormerChannelSA_REBlur_5GPU_FromScratch_600ep

model:
  type: progressive_fusion
  base_dim: 32
  fusion_mode: bidirectional_event_then_rgb_ca
  fusion_dim: 2d
  cross_attn_type: channel
  single_ca_order: event2d_k_event3d_v
  cascaded_ca_order: motion_then_struct
  swapped_kv_order: event3d_first
  key_bridge_order: event3d_first
  encoder_self_attn: restormer_channel
  self_attn_window_size: 8
  cross_attn_window_size: 8
  temporal_window_size: 2
  num_heads: 4
  qk_norm: false
  gamma_init: 0.1
  deform_alignment: none
  decoder_block: plain
  decoder_attention: none
  two_stage: false
  sam_mode: none
  refine_type: shallow

loss:
  type: l1
  edge_weight: 0.05

datasets:
  train:
    dataset_type: h5
    dataroot: /data1/jzy/datasets/REBlur/train
    batch_size: 1
    num_workers: 4
    prefetch_factor: 2
    max_open_h5: 2
    patch_size: 256
    norm_event: true
  val:
    dataset_type: h5
    dataroot: /data1/jzy/datasets/REBlur/test
    max_open_h5: 2
    patch_size: ~
    norm_event: true
    num_workers: 0

train:
  num_epochs: 600
  learning_rate: 0.0002
  val_interval: 5
  seed: 42
  deterministic: true
  stage1_loss_weight: 0.5
  stage2_loss_weight: 1.0

path:
  experiments_root: /data1/jzy/experiments
  pretrain_model: ~
  resume_state: ~
